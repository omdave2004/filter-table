<script>
const plugin = window.powerbi.visuals.plugins.filterTableOm2024AAA;
const NAMES = ['Modern', 'Corporate', 'Minimal', 'Midnight', 'Ledger'];

function makeHost() {
  return {
    eventService: { renderingStarted() {}, renderingFinished() {}, renderingFailed() {} },
    colorPalette: { isHighContrast: false },
    createSelectionManager() { return { select() { return Promise.resolve([]); }, clear() { return Promise.resolve(); }, showContextMenu() {} }; },
    createSelectionIdBuilder() { return { withTable() { return this; }, createSelectionId() { return {}; } }; },
    persistProperties() {}, applyJsonFilter() {},
    downloadService: { exportVisualsContent() { return Promise.resolve(true); } },
    launchUrl(u) { window.open(u, '_blank'); }
  };
}

const columns = [
  { displayName: 'DESTINATION', queryName: 'Movements.DESTINATION', type: { text: true }, index: 0 },
  { displayName: 'SOURCE', queryName: 'Movements.SOURCE', type: { text: true }, index: 1 },
  { displayName: 'WHS_KEY', queryName: 'Movements.WHS_KEY', type: { text: true }, index: 2 },
  { displayName: 'QTY', queryName: 'Movements.QTY', type: { numeric: true }, index: 3 },
  { displayName: 'POSTED', queryName: 'Movements.POSTED', type: { dateTime: true }, index: 4 }
];
const dests = ['CU', 'MA', 'SY', 'BR', 'PE'];
const srcs = ['Adjustments in', 'MA', 'Transfers', 'Receipts', 'Returns'];
const rows = [];
for (let i = 0; i < 60; i++) {
  const d = dests[i % dests.length];
  const s = srcs[(i * 3) % srcs.length];
  const mth = String(1 + (i % 12)).padStart(2, '0');
  rows.push([d, s, d + '|2025-' + mth, Math.round(50 + 950 * Math.abs(Math.sin(i * 2.7))), '2025-' + mth + '-15']);
}

function show(p) {
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  const el = document.createElement('div');
  el.style.cssText = 'width:100%;height:100%';
  stage.appendChild(el);
  const visual = plugin.create({ element: el, host: makeHost() });
  visual.update({
    type: 2,
    viewport: { width: stage.clientWidth, height: stage.clientHeight },
    dataViews: [{
      metadata: { columns: columns, objects: { tableStyle: { stylePreset: String(p) }, proFeatures: { showTotals: true, enableExport: true } } },
      table: { columns: columns, rows: rows }
    }]
  });
  document.querySelectorAll('#btns button').forEach((b, i) => b.classList.toggle('on', i === p));
}

const btns = document.getElementById('btns');
NAMES.forEach((n, i) => {
  const b = document.createElement('button');
  b.textContent = n;
  b.onclick = () => show(i);
  btns.appendChild(b);
});
show(0);
</script>
</body>
